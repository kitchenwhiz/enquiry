<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kitchen Whiz Enquiries</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="/css/base.css?v=1">
<style>
.brands{display:grid;gap:10px}
.brand{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.brand b{font-size:16px}
.brand small{display:block;color:var(--muted);font-family:var(--f-mono);font-size:12.5px}
.brand a{font-weight:600;text-decoration:none;color:var(--accent);white-space:nowrap}
@media (max-width:480px){.brand{grid-template-columns:1fr 1fr}.brand>div{grid-column:1/-1}}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>Kitchen Whiz Enquiries</h1></header>
  <div class="brands">
    <!-- one row per partner: add a folder public/<brand>/ and a line in src/brands.js -->
    <div class="brand"><div><b>Hoshizaki &amp; Western</b><small>enquiry.kitchenwhiz.in/hw</small></div><a href="/hw/">Enquiry form</a><a href="/hw/team/">Team list</a></div>
  </div>
</div>
</body>
</html>
