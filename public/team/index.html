<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Enquiries · Kitchen Whiz Team</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/css/base.css?v=1">
<style>
:root{--warn:#9A5B00;--warn-soft:#FFF1D6;--ok:#1F7A45;--ok-soft:#E3F4EA}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--warn:#F2B35C;--warn-soft:#3A2A10;--ok:#6FD39A;--ok-soft:#173226}}
:root[data-theme="dark"]{--warn:#F2B35C;--warn-soft:#3A2A10;--ok:#6FD39A;--ok-soft:#173226}
.wrap{max-width:980px}
.topbar{display:flex;flex-wrap:wrap;gap:12px;align-items:end;justify-content:space-between}
.me{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.me input{width:170px;padding:7px 10px;font-size:14px}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tab{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 12px;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.tab .n{font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted);background:var(--sunk);border-radius:999px;padding:0 7px}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.tab[aria-pressed="true"] .n{background:transparent;color:var(--surface)}
.tab.alert .n{background:var(--err-soft);color:var(--err)}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.tools .searchbox{flex:1 1 260px}
.tools .searchbox input{font-size:15px}
.status-line{font-size:12.5px;color:var(--muted)}
.list{display:grid;gap:10px}
.enq{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.enq.overdue{border-left:4px solid var(--err)}
.enq.today{border-left:4px solid var(--warn)}
.head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:12px 14px;cursor:pointer;align-items:start}
.head:hover{background:var(--sunk)}
.who{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.who .nm{font-weight:600;font-size:16px}
.who .ref{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.who .ph{font-family:var(--f-mono);font-size:13.5px;white-space:nowrap}
.sum{font-size:13px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badges{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;align-items:center}
.pill{font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:2px 9px;white-space:nowrap}
.s-new{background:var(--accent-soft);color:var(--accent)}
.s-contacted,.s-quoted{background:var(--sunk);color:var(--ink);border:1px solid var(--line)}
.s-won{background:var(--ok-soft);color:var(--ok)}
.s-lost{background:var(--sunk);color:var(--muted);text-decoration:line-through}
.due{font-size:12px;font-weight:600;border-radius:6px;padding:2px 8px;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.due.over{background:var(--err-soft);color:var(--err)}
.due.tdy{background:var(--warn-soft);color:var(--warn)}
.age{font-size:12px;color:var(--muted);white-space:nowrap}
.body{border-top:1px solid var(--line);padding:14px;display:grid;gap:14px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.act{display:inline-flex;gap:8px;align-items:center;text-decoration:none;font-weight:600;font-size:14px;border-radius:8px;padding:9px 14px;border:1px solid var(--line);color:var(--ink);background:var(--surface)}
.act svg{width:18px;height:18px}
.act.call{border-color:var(--accent);color:var(--accent)}
.act.wa{background:var(--wa);border-color:var(--wa);color:var(--on-wa)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--sunk)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td .code{font-family:var(--f-mono);font-weight:600}
td .meta{font-size:12px;color:var(--muted)}
tfoot td{font-weight:600;border-bottom:0;background:var(--sunk)}
.cmt{background:var(--sunk);border-radius:8px;padding:10px 12px;font-size:14px;white-space:pre-wrap}
.lbl{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:6px}
.notes{display:grid;gap:8px}
.note{font-size:13.5px;display:grid;gap:2px;border-left:2px solid var(--line);padding-left:10px}
.note .when{font-size:12px;color:var(--muted)}
.note .chg{font-size:12.5px;color:var(--accent);font-weight:500}
.upd{display:grid;gap:10px;border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--sunk)}
.upd textarea{min-height:64px;background:var(--surface)}
.upd .row3{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:10px;align-items:end}
@media (max-width:620px){.upd .row3{grid-template-columns:1fr}}
.upd input,.upd select{background:var(--surface)}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:3px 8px;cursor:pointer}
.save{font:inherit;font-weight:600;font-size:14px;border:0;background:var(--accent);color:var(--surface);border-radius:8px;padding:10px 18px;cursor:pointer}
.save:disabled{opacity:.6;cursor:default}
@media (max-width:560px){.head{grid-template-columns:minmax(0,1fr)}.badges{justify-content:flex-start}}
.placeholder{padding:28px 16px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}
</style>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <div style="display:grid;gap:4px">
      <span class="eyebrow">Kitchen Whiz · Team</span>
      <h1>Enquiries</h1>
    </div>
    <label class="me" for="me">Updating as<input id="me" placeholder="Your name" maxlength="80" autocomplete="name"></label>
  </header>

  <div class="tabs" id="tabs" role="group" aria-label="Show"></div>
  <div class="tools">
    <div class="searchbox">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search name, phone, model, comment, ref" autocomplete="off" aria-label="Search enquiries">
    </div>
    <span class="status-line" id="statusLine">Loading…</span>
  </div>
  <div class="list" id="list"></div>
  <footer>Prices are dealer prices (DP) from the Hoshizaki &amp; Western list wef 1 April 2026, GST extra. Customer form: <a href="/" target="_blank" rel="noopener">open</a></footer>
</div>
<script src="/js/team.js?v=1"></script>
</body>
</html>
